name: Generate Random US.m3u

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: write

env:
  # 👇 PUT YOUR M3U URL HERE
  M3U_URL: "http://abc25.xyz/get.php?username=0231768061827&password=F439DE4966EC&type=m3u_plus&output=m3u8"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch M3U and build US.m3u
        run: |
          set -euo pipefail

          if [ -z "${M3U_URL:-}" ]; then
            echo "ERROR: M3U_URL is not set in the workflow env" >&2
            exit 1
          fi

          echo "Downloading playlist..."
          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36" \
            "$M3U_URL" -o /tmp/source.m3u

          echo "Downloaded $(wc -l < /tmp/source.m3u) lines"

          # Pair each #EXTINF line with the URL line below it → "EXTINF\tURL"
          awk '
            /^#EXTINF/ { info=$0; next }
            /^#/       { next }
            /^[[:space:]]*$/ { next }
            {
              if (info != "") {
                print info "\t" $0
                info = ""
              }
            }
          ' /tmp/source.m3u > /tmp/pairs.tsv

          TOTAL=$(wc -l < /tmp/pairs.tsv)
          echo "Parsed $TOTAL stream entries"

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No streams parsed from playlist" >&2
            exit 1
          fi

          # Pick 10 random streams
          shuf -n 10 /tmp/pairs.tsv > /tmp/picked.tsv

          # Rebuild US.m3u
          {
            echo "#EXTM3U"
            while IFS=$'\t' read -r info url; do
              printf '%s\n%s\n' "$info" "$url"
            done < /tmp/picked.tsv
          } > US.m3u

          echo "Wrote $(grep -c '^#EXTINF' US.m3u) streams to US.m3u"

      - name: Commit and push US.m3u
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add US.m3u
          if git diff --staged --quiet; then
            echo "No changes to US.m3u"
          else
            git commit -m "Update US.m3u with 10 random streams [skip ci]"
            git push
          fi
